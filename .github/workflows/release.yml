name: Release

on:
  push:
    tags: ['v*']
  # Started by hand on a branch, it builds every platform and releases nothing. The installers are
  # kept as workflow artifacts for a day: the only way to try a build this machine cannot make.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The updater compares versions from the feed, which electron-builder fills from package.json.
  # A tag that says something else would release a version the installed apps do not see.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The tag is the package.json version
        if: github.ref_type == 'tag'
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, package.json says $version."
            exit 1
          fi
      # Its section in CHANGELOG.md is the text of the release; without one, nothing is built.
      - name: The changelog has the version
        if: github.ref_type == 'tag'
        run: node scripts/changelog.mjs --notes "$GITHUB_REF_NAME"

  check:
    uses: ./.github/workflows/check.yml

  build:
    needs: [version, check]
    strategy:
      matrix:
        # macos-latest is Apple silicon; it builds the .dmg for both chips (electron-builder.yml).
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # electron-builder makes the .rpm with rpmbuild, which the Ubuntu runner does not have.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm run dist
      # The installers, and the feeds the updater reads: latest-linux.yml, latest.yml and
      # latest-mac.yml.
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.exe
            release/*.exe.blockmap
            release/*.dmg
            release/latest*.yml
          if-no-files-found: error
          retention-days: 1

  # Only runs when every build succeeded: a release with one platform missing gives the installed
  # apps of that platform a 404 on the update feed. `gh release create` keeps the release a draft
  # until every file is uploaded.
  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Before the download: a checkout empties the folder it works in.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - run: node scripts/changelog.mjs --notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - run: gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
