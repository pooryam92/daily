name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # The updater compares versions from the feed, which electron-builder fills from package.json.
  # A tag that says something else would release a version the installed apps do not see.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The tag is the package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, package.json says $version."
            exit 1
          fi

  check:
    uses: ./.github/workflows/check.yml

  build:
    needs: [version, check]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # electron-builder makes the .rpm with rpmbuild, which the Ubuntu runner does not have.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm run dist
      # The installers, and the feeds the updater reads: latest-linux.yml and latest.yml.
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.exe
            release/*.exe.blockmap
            release/latest*.yml
          if-no-files-found: error
          retention-days: 1

  # Only runs when both builds succeeded: a release with one platform missing gives the installed
  # apps of the other a 404 on the update feed. `gh release create` keeps the release a draft until
  # every file is uploaded.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
