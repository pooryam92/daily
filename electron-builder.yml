appId: io.github.pooryam92.daily
productName: Daily

directories:
  output: release

# Only the build output: the renderer is already bundled by Vite, and the main process needs
# nothing from node_modules but its `dependencies`, which electron-builder adds by itself.
files:
  - out/**
  - '!out/**/*.d.ts'
  - '!out/**/.tsbuildinfo*'

linux:
  target:
    - AppImage
    - deb
    - rpm
  category: Office
  # Icon themes stop at 512px, so the 1024px build/icon.png alone would install an icon no desktop
  # looks up. The set is scaled down from it; Windows still makes its .ico from the big one.
  icon: build/icons
  # The .desktop file is named after `desktopName` in package.json, which is also the window's
  # app_id: that match is what puts the icon on the running window in the dock.
  syncDesktopName: true
  synopsis: A todo app with one card per day

win:
  target: nsis

nsis:
  # The default name has spaces. GitHub turns those into dots when the release workflow uploads the
  # file, while the update feed (latest.yml) says dashes, and the updater would get a 404.
  artifactName: ${productName}-Setup-${version}.${ext}

mac:
  # One .dmg per chip. Both are built on the same (Apple silicon) runner: the app has no native
  # modules, so the other architecture is only a different Electron download.
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.productivity
  # macOS icons sit on a grid with more air around the plate than build/icon.png has; drawn to
  # the edge of it, the icon is a size bigger than its neighbours in the Dock.
  icon: build/icon-mac.png
  # There is no Apple developer certificate, so the app is signed ad hoc: Apple silicon does not
  # start an app without any signature. Gatekeeper still stops the download (README, "macOS").
  # The hardened runtime is only needed for notarization, and with an ad-hoc signature its library
  # validation keeps the app from loading its own Electron framework.
  identity: '-'
  hardenedRuntime: false

dmg:
  # The default leaves the architecture out of the x64 name, and the two files sit side by side.
  artifactName: ${productName}-${version}-${arch}.${ext}

# Where the installed app looks for updates (docs/architecture.md, section 6). Building never uploads:
# `npm run dist` passes `--publish never`, and the release workflow publishes on a tag.
publish:
  provider: github
  owner: pooryam92
  repo: daily
